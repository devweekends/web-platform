name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The 2026 compromise hid loaders in build configs and in fake font files
      # started by auto-run VS Code tasks. Check for both before npm runs.
      - name: Guard against hidden code
        run: |
          status=0
          flag() { echo "::error file=$1::$2"; status=1; }
          for f in $(git ls-files '*.config.*' '.eslintrc*' middleware.ts); do
            if ! awk 'length > 300 { exit 1 }' "$f"; then flag "$f" "Line longer than 300 characters (possible hidden code)"; fi
            if grep -qE '[[:space:]]{40,}[^[:space:]]' "$f"; then flag "$f" "Code hidden after a long run of whitespace"; fi
            if grep -qE 'child_process|createRequire|eval\(|new Function|fromCharCode|_0x[0-9a-f]{4}|global\[' "$f"; then flag "$f" "Suspicious runtime primitive in a build config"; fi
          done
          for f in $(git ls-files '*.woff' '*.woff2' '*.ttf' '*.otf' '*.eot'); do
            if grep -Iq . "$f"; then flag "$f" "Font file is plain text (possible disguised script)"; fi
          done
          for f in $(git ls-files '.vscode/*.json'); do
            if grep -qE 'folderOpen|allowAutomaticTasks' "$f"; then flag "$f" "VS Code task set to run automatically on folder open"; fi
          done
          if grep -qE '"(preinstall|install|postinstall|prepare)"[[:space:]]*:' package.json; then flag package.json "npm install lifecycle scripts are not allowed"; fi
          exit $status

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          # Provide minimal env vars for build to succeed
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-for-ci
          ADMIN_ACCESS_CODE: test
          MENTOR_ACCESS_CODE: test
          AMBASSADOR_ACCESS_CODE: test

  pr-title:
    name: PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # NOTE: This only validates PR title format, does NOT auto-merge.
    # All PRs require manual review and approval by maintainers.

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The subject "{subject}" doesn't match the expected format.
            Please use a descriptive subject line.
